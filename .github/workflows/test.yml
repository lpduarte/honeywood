name: Test data

on:
  push:
    paths: ['data/**', 'source/**', '.github/workflows/test.yml']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the corpus
        run: python3 source/test_data.py
