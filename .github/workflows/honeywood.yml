name: Honeywood daily letter

# The daily trigger is a Cloudflare Cron Trigger (worker/wrangler.toml) firing
# workflow_dispatch at 11:00 and 17:00 UTC — Cloudflare starts within seconds,
# where GitHub's own `on: schedule` queue ran 1–5 h late and sometimes skipped.
# 17:00 is the safety net: --catchup is idempotent (sent_log prevents resends),
# so a repeated or late run recovers the day instead of double-sending.
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Send date override (YYYY-MM-DD). Blank = today.'
        required: false
      dry_run:
        description: 'Render only, do not send (true/false).'
        required: false
        default: 'false'
      check:
        description: 'Only check the gist is reachable; do not send (true/false).'
        required: false
        default: 'false'

env:
  # Node 20 is forced out of GitHub runners on 2026-06-02; run JS actions on Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  send:
    runs-on: ubuntu-latest
    concurrency:
      group: honeywood-send
      cancel-in-progress: false
    permissions:
      contents: write   # to push back data/sent_log.json
      issues: write     # to open an alert issue if a send fails
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send the day's letters
        working-directory: source
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Recipient list: a private gist (single source of truth — see recipients.py).
          RECIPIENTS_GIST_ID: ${{ secrets.RECIPIENTS_GIST_ID }}
          RECIPIENTS_GIST_TOKEN: ${{ secrets.RECIPIENTS_GIST_TOKEN }}
          HONEYWOOD_PATTERN_URL: ${{ vars.HONEYWOOD_PATTERN_URL }}
          HONEYWOOD_UNSUB_BASE: ${{ vars.HONEYWOOD_UNSUB_BASE }}
          SEND_DATE: ${{ github.event.inputs.date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          CHECK: ${{ github.event.inputs.check }}
        run: |
          if [ "$CHECK" = "true" ]; then
            python3 send.py --check
          else
            args=""
            [ -n "$SEND_DATE" ] && args="$args --date $SEND_DATE"
            [ "$DRY_RUN" = "true" ] && args="$args --dry-run"
            # Scheduled run (no explicit date, not a dry-run): catch up any due day not yet sent.
            { [ -z "$SEND_DATE" ] && [ "$DRY_RUN" != "true" ]; } && args="$args --catchup"
            python3 send.py $args
          fi
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "⚠️ Honeywood daily send FAILED ($(date -u +%F))" \
            --body "The daily send job failed. Check the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "could not open alert issue"
      - name: Persist sent log
        if: github.event.inputs.dry_run != 'true' && github.event.inputs.check != 'true'
        run: |
          if [ ! -f data/sent_log.json ]; then
            echo "No sent_log.json (nothing sent); nothing to persist."
            exit 0
          fi
          git add data/sent_log.json
          if git diff --cached --quiet; then
            echo "sent_log.json unchanged; nothing to commit."
          else
            git config user.name "honeywood-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Record sent letters ($(date -u +%F))"
            git push
          fi

  # Rebuild & deploy the archive site in the SAME run as the send, so the calendar's
  # day-tracking and the newly-revealed letter advance together (one reliable cron, no
  # separate site.yml schedule to drift out of sync). if: !cancelled() so the calendar
  # still advances even if the email send failed — the site reveals by date, not sent_log.
  deploy:
    needs: send
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the archive site (revealed up to today)
        run: python3 source/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
