name: Honeywood daily letter

on:
  schedule:
    # 11:00 UTC ≈ 12:00 Lisbon in summer (WEST); 11:00 in winter (WET).
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Send date override (YYYY-MM-DD). Blank = today.'
        required: false
      dry_run:
        description: 'Render only, do not send (true/false).'
        required: false
        default: 'false'
      check:
        description: 'Only check the gist is reachable; do not send (true/false).'
        required: false
        default: 'false'

concurrency:
  group: honeywood-send
  cancel-in-progress: false

permissions:
  contents: write   # to push back data/sent_log.json
  issues: write     # to open an alert issue if a send fails

env:
  # Node 20 is forced out of GitHub runners on 2026-06-02; run JS actions on Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send the day's letters
        working-directory: source
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Recipient list: a private gist (single source of truth — see recipients.py).
          RECIPIENTS_GIST_ID: ${{ secrets.RECIPIENTS_GIST_ID }}
          RECIPIENTS_GIST_TOKEN: ${{ secrets.RECIPIENTS_GIST_TOKEN }}
          HONEYWOOD_PATTERN_URL: ${{ vars.HONEYWOOD_PATTERN_URL }}
          HONEYWOOD_UNSUB_BASE: ${{ vars.HONEYWOOD_UNSUB_BASE }}
          SEND_DATE: ${{ github.event.inputs.date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          CHECK: ${{ github.event.inputs.check }}
        run: |
          if [ "$CHECK" = "true" ]; then
            python3 send.py --check
          else
            args=""
            [ -n "$SEND_DATE" ] && args="$args --date $SEND_DATE"
            [ "$DRY_RUN" = "true" ] && args="$args --dry-run"
            # Scheduled run (no explicit date, not a dry-run): catch up any due day not yet sent.
            { [ -z "$SEND_DATE" ] && [ "$DRY_RUN" != "true" ]; } && args="$args --catchup"
            python3 send.py $args
          fi
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "⚠️ Honeywood daily send FAILED ($(date -u +%F))" \
            --body "The daily send job failed. Check the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "could not open alert issue"
      - name: Persist sent log
        if: github.event.inputs.dry_run != 'true' && github.event.inputs.check != 'true'
        run: |
          if [ ! -f data/sent_log.json ]; then
            echo "No sent_log.json (nothing sent); nothing to persist."
            exit 0
          fi
          git add data/sent_log.json
          if git diff --cached --quiet; then
            echo "sent_log.json unchanged; nothing to commit."
          else
            git config user.name "honeywood-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Record sent letters ($(date -u +%F))"
            git push
          fi
